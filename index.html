<div id="hud"><div class="top"><div class="brand"><b>☕ COFFEE TIME</b><small>A little café, a lovely day</small></div><div class="stats"><span>🪙 <i id="coins">35</i></span><span>☕ <i id="served">0</i></span><span>🔥 <i id="combo">0</i></span><span>⭐ <i id="rating">5.0</i></span><span>🥛 <i id="milk">12</i></span></div></div>

<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');let W=1200,H=680,dpr=1,scale=1,ox=0,oy=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;const s=Math.min(W/1200,H/680);scale=s;ox=(W-1200*s)/2;oy=(H-680*s)/2;ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy)}addEventListener('resize',resize);resize();
const ink='#302820',paper='#f4e4c6',line=5;
// Soft ink-on-paper finish: less polished gradients, more like the supplied hand-drawn strip.

function path(points,fill,stroke=ink,lw=4){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke()}
function rr(x,y,w,h,r,fill,stroke=ink,lw=4){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
function ellipse(x,y,rx,ry,fill,stroke=ink,lw=4){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
function lineTo(points,color=ink,lw=4){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function text(t,x,y,size=18,color=ink,font='Georgia'){ctx.fillStyle=color;ctx.font=size+'px '+font;ctx.fillText(t,x,y)}
function drawBackground(t){ctx.fillStyle='#f3e2c2';ctx.fillRect(0,0,1200,680);
 // warm, nearly blank paper like the reference illustration
 for(let i=0;i<150;i++){const x=(i*137)%1200,y=(i*83)%680;ctx.fillStyle='rgba(115,78,45,.035)';ctx.fillRect(x,y,1.5,1.5)}
 ctx.fillStyle='#d8c096';ctx.fillRect(0,624,1200,56);
 lineTo([[0,624],[1200,624]],'#9e8059',2);
 // faint hand-painted floor shadow
 ellipse(600,626,580,8,'rgba(90,60,35,.10)','rgba(0,0,0,0)',0);
}
function drawCoffeeMachine(t){ctx.save();ctx.translate(18,0);
 // shadow
 ellipse(160,572,166,13,'rgba(72,49,29,.18)','rgba(72,49,29,0)',0);
 // base and body
 rr(4,548,322,70,17,'#64aeb8');rr(13,252,308,305,17,'#69b5bf');rr(26,265,281,274,13,'#78c0c5','#315b5b',3);
 // side edge and base vents
 rr(55,580,78,10,4,'#4b9299','#315b5b',2);rr(55,597,78,8,4,'#4b9299','#315b5b',2);
 // top rail and bean hopper
 lineTo([[27,230],[310,230]],'#493b2e',5);lineTo([[27,230],[27,247],[310,247],[310,230]],'#493b2e',3);
 rr(42,160,92,70,15,'#fff0d5');ellipse(88,162,46,11,'#fff3d9');ellipse(88,169,38,8,'#9b744c','#4b3627',2);for(let i=0;i<23;i++){ellipse(58+(i*19)%58,177+(i*13)%39,4,2.8,'#8c633e','#64452e',1)}
 rr(151,194,55,35,6,'#f9ecd4');rr(211,179,49,50,7,'#fff0d5');rr(267,180,50,50,7,'#f5e4c7');rr(278,183,18,40,5,'#e4cba2','#594431',2);
 // buttons and gauge
 ellipse(83,310,11,11,'#e77e4e');ellipse(115,310,10,10,'#e9c45c');ellipse(145,310,10,10,'#e9c45c');
 ellipse(230,311,26,26,'#f8efda','#3c332c',4);ellipse(230,311,19,19,'#fff9e8','#7d6953',2);lineTo([[230,311],[240,298]],'#302820',3);lineTo([[230,311],[224,317]],'#302820',2);
 // right knob
 ellipse(342,308,15,30,'#9a9c90');ellipse(344,308,8,22,'#c4c4b5');
 // group head and portafilter
 rr(184,365,101,56,10,'#454746');rr(194,375,80,38,7,'#b9b8aa');rr(205,383,56,21,5,'#eee4d1','#554638',2);
 lineTo([[205,399],[184,427],[184,492]],'#35312c',7);ellipse(184,492,6,7,'#292725');
 rr(260,397,100,15,7,'#292523');ellipse(358,404,9,7,'#171615');rr(320,394,44,20,8,'#211e1c');
 // cup and espresso
 rr(204,489,70,51,12,'#fff0d7','#4e4032',4);ellipse(239,489,35,8,'#fff7e6');ellipse(239,490,27,4,'#68402a','#68402a',1);ctx.beginPath();ctx.arc(274,512,16,-Math.PI/2,Math.PI/2);ctx.strokeStyle='#fff0d7';ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.stroke();
 // cup steam
 for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(222+i*16,476);ctx.bezierCurveTo(210+i*16,465,235+i*16,458,222+i*16,446);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.stroke()}
 // machine small highlights
 lineTo([[22,276],[22,525]],'rgba(255,255,255,.45)',4);ctx.restore();
}
function drawSnoopy(x,y,t){ctx.save();ctx.translate(x,y); // white dog side-on silhouette
 // tail and body
 lineTo([[-28,-25],[-43,-41],[-48,-36]],'#fffdf5',5);ellipse(0,-29,31,19,'#fffdf5');ellipse(24,-48,28,26,'#fffdf5');ellipse(45,-46,12,18,'#262629');ellipse(8,-67,4,4,ink,ink,1);
 // muzzle
 ellipse(48,-38,19,10,'#fffdf5');ellipse(63,-41,3.5,3.5,ink,ink,1);
 // ear
 ellipse(29,-27,12,22,'#262629');ellipse(0,-4,9,24,'#fffdf5');ellipse(25,-3,9,24,'#fffdf5');ellipse(-4,18,14,5,'#fffdf5');ellipse(29,18,14,5,'#fffdf5');
 // collar
 lineTo([[-12,-15],[6,-12],[10,-7]],'#c65b4c',3);
 ctx.restore()}
function drawWoodstock(x,y,t){ctx.save();ctx.translate(x,y);path([[-13,-8],[-4,-25],[0,-14],[8,-28],[10,-10],[20,-16],[14,-1],[20,4],[5,3],[-2,13],[-7,2],[-18,5]],'#edc34d');ellipse(6,-12,2.3,2.3,ink,ink,1);lineTo([[0,4],[-4,17],[2,17],[5,5]],ink,2);lineTo([[8,4],[12,16],[17,16]],ink,2);ctx.restore()}
function drawHuman(x,y,type,t,walk=0){ctx.save();ctx.translate(x,y);const bob=Math.sin(t*5+walk)*1.5;ctx.translate(0,bob);
 const skin='#f1c7a1',dark='#282522';
 // legs, shoes
 const step=Math.sin(t*8+walk)*2.5;lineTo([[-9,-28],[-11,-5+step],[-17,0]],dark,5);lineTo([[9,-28],[12,-5-step],[17,0]],dark,5);ellipse(-18,0,11,4,'#40342c');ellipse(18,0,11,4,'#40342c');
 // clothes
 if(type==='charlie'){path([[-23,-83],[21,-83],[25,-29],[13,-24],[-20,-27]],'#f0bf45');path([[-23,-83],[-15,-72],[-7,-82],[0,-72],[8,-82],[16,-72],[21,-83]],'#f4d24e');}
 else if(type==='lucy'){path([[-22,-82],[20,-82],[25,-32],[0,-22],[-25,-32]],'#69aebe');path([[-27,-35],[27,-35],[33,-25],[0,-18],[-33,-25]],'#e3a6a0');}
 else if(type==='linus'){path([[-22,-82],[21,-82],[25,-29],[12,-24],[-22,-29]],'#c86e4e');lineTo([[-20,-63],[20,-63]],'#f1c7a1',3);}
 else if(type==='sally'){path([[-22,-82],[22,-82],[28,-27],[0,-22],[-28,-27]],'#e8a3a0');}
 else if(type==='franklin'){path([[-22,-82],[22,-82],[25,-28],[-24,-28]],'#8b83a7');}
 else {path([[-22,-82],[22,-82],[25,-28],[-24,-28]],'#8f82a8');}
 // arms
 lineTo([[-20,-75],[-30,-48],[-23,-40]],skin,9);lineTo([[20,-75],[29,-51],[24,-43]],skin,9);
 // head
 ellipse(0,-108,25,28,skin);ellipse(-25,-108,5,8,skin);ellipse(25,-108,5,8,skin);
 // hair styles
 if(type==='charlie'){ctx.beginPath();ctx.moveTo(-10,-132);ctx.quadraticCurveTo(-18,-145,-7,-143);ctx.quadraticCurveTo(1,-142,-1,-135);ctx.strokeStyle='#4a3028';ctx.lineWidth=3;ctx.stroke();}
 else if(type==='lucy'){ellipse(-2,-129,27,16,dark);ellipse(18,-112,12,23,dark);path([[-25,-123],[-29,-141],[-9,-147],[15,-139],[25,-122],[9,-128]],dark);}
 else if(type==='linus'){path([[-25,-120],[-19,-139],[0,-145],[20,-135],[25,-117],[12,-126],[0,-120],[-12,-126]],'#e5d2a8');}
 else if(type==='sally'){ellipse(0,-132,25,12,'#e8d6a0');for(let i=0;i<7;i++)ellipse(-20+i*7,-138+(i%2)*-3,4,5,'#e8d6a0');}
 else if(type==='franklin'){ellipse(0,-132,26,14,'#302820');ellipse(-17,-126,8,12,'#302820');}
 else {ellipse(0,-132,27,13,dark);for(let i=0;i<5;i++)ellipse(-19+i*9,-137-(i%2)*3,5,5,dark);}
 // face profile and expression
 ellipse(9,-110,2.4,2.8,dark,dark,1);ctx.beginPath();ctx.arc(14,-99,6,.1,1.2);ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.stroke();
 if(type==='charlie'){lineTo([[-6,-83],[0,-72],[7,-82]],'#f4d8a0',3)}
 ctx.restore()}
function drawQueue(t){const positions=[590,700,810,920,1030];const types=['charlie','lucy','linus','sally','franklin'];for(let i=0;i<4;i++){const p=customers[i];if(!p.userData.busy)continue;const target=positions[i];p.x+=(target-p.x)*.035;drawHuman(p.x,558,types[i],t,i);if(p===active){ellipse(p.x,420,42,12,'rgba(90,58,35,.10)','rgba(0,0,0,0)',0);rr(p.x-39,388,78,27,9,'#fff9e9','#7b5c43',2);text(active.recipe.name,p.x-30,407,13);}}}
function drawTables(t){function table(x,y){ellipse(x,y+40,58,12,'rgba(80,53,31,.12)','rgba(0,0,0,0)',0);rr(x-48,y-5,96,12,5,'#b98252');lineTo([[x,y+5],[x,y+75]],'#7a5134',9);lineTo([[x-35,y+76],[x+35,y+76]],'#7a5134',6);rr(x-91,y+17,30,39,8,'#e6b958');rr(x+60,y+17,30,39,8,'#e6b958');}table(770,510);table(1050,490)}
function drawAll(t){ctx.clearRect(0,0,1200,680);drawBackground(t);
 // minimal kitchen shelf and cups, preserving the reference image's uncluttered composition
 lineTo([[28,230],[330,230]],'#493b2e',4);lineTo([[28,230],[28,247],[330,247],[330,230]],'#493b2e',2);
 rr(45,173,55,54,8,'#fff0d7');ellipse(72,173,27,7,'#fff0d7');rr(115,188,50,39,6,'#fff0d7');rr(176,164,53,63,7,'#f1dfbd');rr(235,180,65,47,7,'#f8e8ca');
 drawCoffeeMachine(t);
 // spare takeaway cups
 for(let i=0;i<3;i++){rr(350+i*23,576-i*3,25,25,5,'#fff2d8','#6b5140',2);ellipse(362+i*23,576-i*3,12,3,'#fff8e9','#6b5140',1)}
 // Snoopy and Woodstock wait beside the machine; the customers form the original queue composition
 drawSnoopy(410,624,t);drawWoodstock(485,622,t);drawQueue(t);
 lineTo([[0,624],[1200,624]],'rgba(112,80,48,.25)',2);
}
const types=['charlie','lucy','linus','sally','franklin'];let customers=types.map((type,i)=>({type,x:590+i*110,userData:{busy:false}}));
let coins=35,served=0,level=1,combo=0,queue=[],active=null,spawnClock=0,gameTime=0,clock=0,activeReward=0,toastTimer;
const recipes=[{name:'Espresso',price:6,steps:['Grind beans','Pull espresso'],need:{beans:1,milk:0,choc:0},unlock:0},{name:'Latte',price:9,steps:['Grind beans','Pull espresso','Steam milk','Pour latte'],need:{beans:1,milk:1,choc:0},unlock:0},{name:'Cappuccino',price:10,steps:['Grind beans','Pull espresso','Steam milk','Add foam'],need:{beans:1,milk:1,choc:0},unlock:4},{name:'Mocha',price:11,steps:['Grind beans','Pull espresso','Add chocolate','Steam milk'],need:{beans:1,milk:1,choc:1},unlock:8}];
let stock={beans:18,milk:12,choc:6},day=1,dayServed=0,goal=8,dayBonus=30,unlocked=['Espresso','Latte'],soundOn=localStorage.getItem('snoopySound')!=='off',audioCtx=null;
const $=s=>document.querySelector(s);
let ambientStarted=false;function audio(){if(!soundOn)return null;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(!ambientStarted){ambientStarted=true;const a=audioCtx;const hum=a.createOscillator(),hg=a.createGain(),filter=a.createBiquadFilter();hum.type='sine';hum.frequency.value=92;filter.type='lowpass';filter.frequency.value=170;hg.gain.value=.012;hum.connect(filter);filter.connect(hg);hg.connect(a.destination);hum.start();const hum2=a.createOscillator(),g2=a.createGain();hum2.type='sine';hum2.frequency.value=138;g2.gain.value=.004;hum2.connect(g2);g2.connect(a.destination);hum2.start()}return audioCtx}catch(e){return null}}
function tone(freq,dur=.12,wave='sine',vol=.035,delay=0){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=wave;o.frequency.setValueAtTime(freq,a.currentTime+delay);g.gain.setValueAtTime(.0001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,a.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur+.03)}
function sfx(kind){if(!soundOn)return;if(kind==='click'){tone(620,.05,'triangle',.018)}if(kind==='grind'){tone(95,.32,'sawtooth',.025);tone(120,.28,'sawtooth',.018,.18)}if(kind==='steam'){tone(700,.35,'sawtooth',.012);tone(950,.28,'sine',.009,.18)}if(kind==='pour'){tone(440,.16,'sine',.025);tone(550,.22,'sine',.02,.16)}if(kind==='success'){tone(660,.12,'triangle',.04);tone(830,.16,'triangle',.04,.12);tone(990,.2,'triangle',.035,.25)}if(kind==='bad'){tone(180,.22,'triangle',.04);tone(130,.25,'triangle',.03,.18)}if(kind==='cash'){tone(900,.07,'square',.025);tone(1200,.09,'square',.02,.08)}}
function update(){ $('#coins').textContent=coins;$('#served').textContent=served;$('#combo').textContent=combo;$('#milk').textContent=stock.milk;$('#rating').textContent=Math.min(5,4.5+served*.025+Math.min(.1,combo*.01)).toFixed(1);$('#objective').textContent='Day '+day+' · '+dayServed+'/'+goal+' orders · bonus '+dayBonus+' coins';$('#order').textContent=active?'ORDER: '+active.recipe.name+' · '+active.recipe.price+' coins · Step '+(active.step+1)+'/'+active.recipe.steps.length:'Waiting for customers…';const p=active?Math.max(0,active.patience/active.maxPatience*100):100;$('#patience').style.width=p+'%';$('#patience').style.background=p<30?'#d66b55':p<60?'#dfad50':'#75a66b'}
function toast(t){$('#message').textContent=t;const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,2300)}
function show(title,desc,items){$('#title').textContent=title;$('#desc').textContent=desc;const c=$('#choices');c.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.textContent=it.label;b.disabled=!!it.disabled;b.onclick=()=>{$('#dialog').classList.remove('open');it.run()};c.append(b)});$('#dialog').classList.add('open')}
function layoutQueue(){queue.forEach((o,i)=>{o.person.x=(active?700:590)+i*110});if(active)active.person.x=590}
function canMake(r){return stock.beans>=r.need.beans&&stock.milk>=r.need.milk&&stock.choc>=r.need.choc}
function newCustomer(){if(queue.length+(active?1:0)>=4)return;const p=customers.find(x=>!x.userData.busy);if(!p)return;const available=recipes.filter(r=>unlocked.includes(r.name)&&canMake(r));if(!available.length){toast('Supplies are low! Open Supplies to restock.');return}const patience=level>=3?64:52;p.userData.busy=true;p.x=1180;queue.push({person:p,recipe:available[Math.floor(Math.random()*available.length)],patience,maxPatience:patience,step:0});layoutQueue();if(!active)nextCustomer();toast('A new customer joined the queue.')}
function nextCustomer(){if(active||!queue.length)return;active=queue.shift();active.patience=active.maxPatience;layoutQueue();update();toast('New order: '+active.recipe.name+'. Make it before they lose patience!')}
function finish(success){if(!active)return;const p=active.person;active=null;p.userData.busy=false;p.x=1180;if(success){served++;dayServed++;combo++;const tip=Math.floor(combo/3)*2;coins+=activeReward+tip;stock.beans-=p.orderNeed?.beans||0;stock.milk-=p.orderNeed?.milk||0;stock.choc-=p.orderNeed?.choc||0;sfx('success');sfx('cash');toast('Perfect! +'+(activeReward+tip)+' coins'+(tip?' · combo tip +'+tip:''));if(served>=4&&!unlocked.includes('Cappuccino')){unlocked.push('Cappuccino');toast('New recipe unlocked: Cappuccino!')}if(served>=8&&!unlocked.includes('Mocha')){unlocked.push('Mocha');toast('New recipe unlocked: Mocha!')}if(dayServed>=goal){coins+=dayBonus;toast('Daily goal reached! Bonus +'+dayBonus+' coins!');goal+=2;dayBonus+=10;dayServed=0;day++}}else{combo=0;sfx('bad');toast('Customer left. The queue is waiting.')}layoutQueue();update();setTimeout(nextCustomer,450)}
function makeOrder(){if(!active){nextCustomer();if(!active){toast('No customer yet. A new customer will arrive soon.');return}}const order=active;if(order.step===0&&!canMake(order.recipe)){toast('Not enough ingredients. Restock first!');return}const step=order.recipe.steps[order.step];show(order.recipe.name+' order','Step '+(order.step+1)+' of '+order.recipe.steps.length+': '+step,[{label:'✓ '+step,run:()=>{if(active!==order)return;if(order.step===0){order.person.orderNeed={...order.recipe.need}}const stepSound=step.toLowerCase().includes('grind')?'grind':step.toLowerCase().includes('steam')?'steam':'pour';sfx(stepSound);order.step++;if(order.step===order.recipe.steps.length){activeReward=order.recipe.price+(level-1)*2;finish(true)}else{toast('Nice! Next: '+order.recipe.steps[order.step]);update();makeOrder()}}},{label:'✕ Wrong action',run:()=>{if(active!==order)return;order.patience-=12;combo=0;toast('Wrong step! Check the recipe and hurry.');update();makeOrder()}}])}
function supplies(){show('Supply shop','Keep your pantry stocked. Ingredient deliveries cost coins.',[{label:'Coffee beans +10 · 12 coins',disabled:coins<12,run:()=>{coins-=12;stock.beans+=10;update();sfx('cash');toast('Fresh coffee beans delivered!')}},{label:'Milk +8 · 10 coins',disabled:coins<10,run:()=>{coins-=10;stock.milk+=8;update();sfx('cash');toast('Fresh milk delivered!')}},{label:'Chocolate +6 · 9 coins',disabled:coins<9,run:()=>{coins-=9;stock.choc+=6;update();sfx('cash');toast('Chocolate restocked!')}},{label:'Back to café',run:()=>{}}])}
function upgrade(){show('Café upgrades','Machine level '+level+'. Each upgrade increases drink earnings and customer patience.',[{label:'Upgrade · '+25*level+' coins',disabled:coins<25*level,run:()=>{const cost=25*level;if(coins>=cost){coins-=cost;level++;if(active){active.patience+=8;active.maxPatience+=8}update();toast('Machine upgraded to level '+level+'!')}else toast('Not enough coins yet.')}},{label:'Keep serving',run:()=>{}}])}
$('#menu').onclick=()=>{audio();sfx('click');makeOrder()};$('#shop').onclick=()=>{audio();supplies()};$('#upgrade').onclick=()=>{audio();upgrade()};$('#sound').onclick=()=>{soundOn=!soundOn;localStorage.setItem('snoopySound',soundOn?'on':'off');$('#sound').textContent=soundOn?'🔊 Sound on':'🔇 Sound off';if(soundOn){audio();sfx('success')}else if(audioCtx){audioCtx.suspend()}};$('#sound').textContent=soundOn?'🔊 Sound on':'🔇 Sound off';$('#close').onclick=()=>$('#dialog').classList.remove('open');$('#restart').onclick=()=>{coins=35;served=0;level=1;combo=0;day=1;dayServed=0;goal=8;dayBonus=30;stock={beans:18,milk:12,choc:6};unlocked=['Espresso','Latte'];queue=[];active=null;customers.forEach(p=>{p.userData.busy=false;p.x=1180});gameTime=0;spawnClock=0;newCustomer();update();toast('A fresh café day begins!')};
canvas.addEventListener('pointerdown',e=>{const x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale;if(x<380&&y>245&&y<625){makeOrder();return}if(x>370&&x<465&&y>475){show('Snoopy’s little treat','A biscuit makes Snoopy very happy. It costs 3 coins and gives your café a small reputation boost.',[{label:'Give biscuit · 3 coins',disabled:coins<3,run:()=>{coins-=3;served+=0;combo++;sfx('success');update();toast('Snoopy is wagging his tail! Café reputation +0.1')}},{label:'Not now',run:()=>{}}]);return}if(x>480&&x<525&&y>490){toast('Woodstock chirps happily!');sfx('click');return}if(active&&x>active.person.x-45&&x<active.person.x+45&&y>420&&y<580){makeOrder();return}if(x>0&&x<1200&&y>250){toast('Tap the blue espresso machine to prepare the current order.')}});
function frame(now){const dt=Math.min(.05,clock?(now-clock)/1000:.016);clock=now;gameTime+=dt;spawnClock+=dt;if(spawnClock>10.5){spawnClock=0;newCustomer()}if(active){active.patience-=dt;if(active.patience<=0)finish(false);update()}drawAll(now/1000);requestAnimationFrame(frame)}
newCustomer();setTimeout(newCustomer,3500);update();toast('Welcome! Turn sound on, serve orders, restock ingredients and hit the daily goal.');requestAnimationFrame(frame);
</script></body></html>
