<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f2dfbd"><title>Coffee Time — Snoopy Café</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#f2dfbd;color:#49392d}canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;padding:clamp(10px,2vw,22px);display:flex;flex-direction:column;justify-content:space-between}
.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand,.stats,.info{background:#fff8e9e8;border:2px solid #76543c;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 #60452d30}
.brand b{font-size:22px;letter-spacing:.04em}.brand small{display:block;opacity:.7}.stats{display:flex;gap:15px;font-weight:800}.bottom{align-items:end}.info{max-width:min(420px,60vw);font-size:13px}.info b{font-size:15px}.actions{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{border:2px solid #654832;border-radius:13px;background:#fff4df;color:#443327;font-weight:800;padding:11px 14px;box-shadow:0 4px 0 #5b423255;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #5b423255}button.primary{background:#70b7bd}
#dialog{display:none;position:fixed;inset:0;background:#2c211b88;place-items:center;padding:18px;pointer-events:auto}#dialog.open{display:grid}.sheet{width:min(420px,100%);background:#fff4dd;border:3px solid #654832;border-radius:22px;padding:20px;box-shadow:0 10px 0 #39281d55}.sheet h2{margin:0 0 6px}.sheet p{line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#45362be8;color:#fff5e5;padding:10px 16px;border-radius:24px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;font-size:13px}
@media(max-width:600px){.stats{gap:8px;padding:8px;font-size:12px}.brand{padding:8px 10px}.brand b{font-size:17px}.brand small{display:none}.info{max-width:50vw;padding:9px}.actions{max-width:48vw}.actions button{font-size:12px;padding:10px}.stats span:last-child{display:none}}
</style></head><body><div id="app"></div>
<div id="hud"><div class="top"><div class="brand"><b>☕ COFFEE TIME</b><small>A little café, a lovely day</small></div><div class="stats"><span>🪙 <i id="coins">35</i></span><span>☕ <i id="served">0</i></span><span>⭐ <i id="rating">5.0</i></span></div></div>
<div class="bottom"><div class="info"><b id="objective">Welcome, barista!</b><div id="message">Tap the espresso machine to prepare your first coffee.</div></div><div class="actions"><button id="menu">☕ Menu</button><button id="upgrade">⬆ Upgrade</button><button id="camera">↻ View</button></div></div></div>
<div id="toast"></div><div id="dialog"><div class="sheet"><h2 id="title">Coffee menu</h2><p id="desc">Choose a drink to prepare.</p><div class="choices" id="choices"></div><div style="text-align:right;margin-top:14px"><button id="close">Close</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const app=document.querySelector('#app'),scene=new THREE.Scene();scene.background=new THREE.Color('#f2dfbd');scene.fog=new THREE.Fog('#f2dfbd',22,42);
const camera=new THREE.OrthographicCamera(-11,11,8,-8,.1,100);camera.position.set(13,15,17);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff4dc,0x8b7158,2));const sun=new THREE.DirectionalLight(0xffedce,2.3);sun.position.set(-8,14,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const material=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const C={floor:material('#d5b88c'),tile:material('#e9d6b5'),wall:material('#f5e8d1'),blue:material('#65aeb8'),dark:material('#34484a'),metal:material('#b6b9b0',.35),wood:material('#916747'),lightwood:material('#bd8b5e'),cream:material('#fff0d5'),coffee:material('#59301e'),green:material('#78946b'),yellow:material('#e7bc58'),pink:material('#df9b91'),black:material('#34302f'),white:material('#fff8e9'),skin:material('#efc49c')};
function block(parent,x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(parent,x,y,z,r,h,m,rt=r){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,rt,h,20),m);o.position.set(x,y+h/2,z);o.castShadow=true;parent.add(o);return o}
block(scene,0,-.25,0,20,.5,16,C.floor);
for(let x=-9;x<=9;x+=2)for(let z=-7;z<=7;z+=2)block(scene,x,.005,z,1.94,.025,1.94,C.tile);
block(scene,0,0,-7.75,20,5.2,.35,C.wall);block(scene,-9.8,0,-1, .35,5.2,13,C.wall);
block(scene,0,4.9,-7.55,20,.2,.5,C.wood);
block(scene,-4,2.3,-7.53,4.7,2.7,.13,C.blue);block(scene,-4,2.3,-7.42,4.5,.1,.15,C.wood);block(scene,-4,2.3,-7.4,.1,2.6,.15,C.wood);
block(scene,-5.2,0,-3.3,4.6,1.1,1.5,C.wood);block(scene,-5.2,1.1,-3.3,4.7,.16,1.6,C.cream);
block(scene,-6.15,1.26,-3.8,1.45,2.15,.95,C.blue);block(scene,-6.15,3.42,-3.8,1.48,.14,.98,C.dark);block(scene,-6.15,2.62,-3.28,1.08,.65,.1,C.metal);cylinder(scene,-6.15,2.15,-3.2,.34,.22,C.dark);cylinder(scene,-6.15,2.35,-3.2,.27,.1,C.metal);block(scene,-5.55,2.53,-3.22,.8,.12,.16,C.black);cylinder(scene,-6.15,1.43,-3.12,.32,.12,C.cream);cylinder(scene,-6.15,1.55,-3.12,.26,.08,C.coffee);
block(scene,-3.9,1.25,-3.25,.68,.95,.68,C.dark);cylinder(scene,-3.9,1.9,-3.25,.3,.36,C.metal);cylinder(scene,-3.9,2.12,-3.25,.28,.08,C.lightwood);
block(scene,1.5,2.8,-7.5,3.6,2.6,.2,C.wood);block(scene,1.5,2.8,-7.37,3.35,2.35,.08,C.dark);for(let i=0;i<4;i++)block(scene,.65,3.55-i*.47,-7.31,1.65-i*.15,.035,.025,C.cream);
function table(x,z){cylinder(scene,x,.8,z,.72,.14,C.lightwood);cylinder(scene,x,.1,z,.13,1.35,C.wood);for(const dx of [-.48,.48])for(const dz of [-.48,.48])block(scene,x+dx,.02,z+dz,.12,.78,.12,C.wood);for(const dx of [-1.05,1.05]){cylinder(scene,x+dx,.42,z,.3,.12,C.yellow);block(scene,x+dx,.47,z-.25,.56,.65,.1,C.wood)}}
table(2.6,-1.5);table(5,-4.6);
function plant(x,z){cylinder(scene,x,.12,z,.32,.28,C.lightwood);for(let i=0;i<6;i++){const leaf=cylinder(scene,x+Math.sin(i)*.2,.4,z+Math.cos(i)*.2,.1,.7,C.green,.05);leaf.rotation.z=(i-2.5)*.17}}
plant(7,-6);plant(7,1);
function character(x,z,shirt,skin,hair,kind){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const shirtM=material(shirt),skinM=material(skin),hairM=material(hair);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.31,.58,5,10),shirtM);body.position.y=.82;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,18,16),skinM);head.position.y=1.57;head.scale.set(.95,1.08,.9);head.castShadow=true;g.add(head);const cap=new THREE.Mesh(new THREE.SphereGeometry(.39,18,12,0,Math.PI*2,0,Math.PI*.55),hairM);cap.position.set(0,1.68,-.03);g.add(cap);const arms=[];for(const s of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.4,4,8),shirtM);arm.position.set(s*.38,.92,0);arm.rotation.z=s*.2;g.add(arm);arms.push(arm);const leg=block(g,s*.15,.02,.02,.14,.45,.18,C.black);const eye=new THREE.Mesh(new THREE.SphereGeometry(.03,8,8),C.black);eye.position.set(s*.13,1.62,.33);g.add(eye)}g.userData={arms,kind,target:new THREE.Vector3(x,0,z),home:new THREE.Vector3(x,0,z)};return g}
const snoopy=character(-3.15,0,'#fff8e9','#fff8e9','#303235','Snoopy');snoopy.scale.set(1.04,.82,.9);
const woodstock=character(-1.5,0,'#e9bd56','#e9bd56','#e9bd56','Woodstock');woodstock.scale.set(.52,.62,.52);
const customers=[character(0,1,'#e8bd57','#f1cba6','#6a4c3d','Charlie'),character(2,1,'#72aeba','#e9bc99','#3b302d','Lucy'),character(4,1,'#d98f7e','#efc7a9','#e5c36d','Friend'),character(6,1,'#9b8eb7','#bd8866','#302c2a','Friend')];
customers.forEach((p,i)=>p.userData.target.set(-2.2+i*.9,0,1));
let coins=35,served=0,level=1,queue=0;
const $=s=>document.querySelector(s);function update(){ $('#coins').textContent=coins;$('#served').textContent=served;$('#rating').textContent=(Math.min(5,4.6+served*.04)).toFixed(1);$('#objective').textContent=served?'Orders served: '+served+' · Keep the queue happy':'Welcome, barista!'}
let toastTimer;function toast(t){$('#message').textContent=t;const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,2200)}
function show(title,desc,items){$('#title').textContent=title;$('#desc').textContent=desc;const c=$('#choices');c.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.textContent=it.label;b.onclick=()=>{it.run();$('#dialog').classList.remove('open')};c.append(b)});$('#dialog').classList.add('open')}
function serve(name,price){coins+=price;served++;queue++;update();toast(name+' served! +'+price+' coins.');const p=customers[(queue-1)%customers.length];p.userData.target.set(3+Math.random()*2,0,-1-Math.random()*3);setTimeout(()=>{p.position.copy(p.userData.home);p.userData.target.copy(new THREE.Vector3(-2.2+(queue%4)*.9,0,1))},5200)}
function coffeeMenu(){show('Make a coffee','Choose a drink for the next customer.',[{label:'Espresso · 5',run:()=>serve('Espresso',5)},{label:'Latte · 8',run:()=>serve('Latte',8)},{label:'Cappuccino · 9',run:()=>serve('Cappuccino',9)},{label:'Mocha · 10',run:()=>serve('Mocha',10)}])}
$('#menu').onclick=coffeeMenu;$('#upgrade').onclick=()=>show('Café upgrades','Machine level '+level+'. Better equipment makes every cup more valuable.',[{label:'Upgrade · 25',run:()=>{if(coins>=25){coins-=25;level++;update();toast('Machine upgraded to level '+level+'!')}else toast('Not enough coins yet.')} }]);$('#close').onclick=()=>$('#dialog').classList.remove('open');
let view=0;$('#camera').onclick=()=>{view++;camera.position.set(view%2?16:13,view%2?13:15,view%2?14:17);camera.lookAt(0,1,0)};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let meshes=[];scene.traverse(o=>{if(o.isMesh)meshes.push(o)});renderer.domElement.addEventListener('pointerdown',e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,camera);const h=ray.intersectObjects(meshes);if(!h.length)return;const p=h[0].point;if(p.x< -4.35&&p.z< -2){coffeeMenu();return}const near=[snoopy,woodstock,...customers].find(c=>Math.hypot(c.position.x-p.x,c.position.z-p.z)<.85);if(near)toast(near.userData.kind==='Snoopy'?'Snoopy gives you a happy little nod.':near.userData.kind+' smiles and looks at the coffee machine.');else toast('A lovely little corner of the café.')});
function resize(){const a=innerWidth/innerHeight,v=8.6;camera.left=-v*a/2;camera.right=v*a/2;camera.top=v/2;camera.bottom=-v/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
let t=0;function animate(){requestAnimationFrame(animate);t+=.016;[snoopy,woodstock,...customers].forEach((p,i)=>{const u=p.userData,dx=u.target.x-p.position.x,dz=u.target.z-p.position.z;if(Math.hypot(dx,dz)>.08){p.position.x+=dx*.018;p.position.z+=dz*.018;p.rotation.y=Math.atan2(dx,dz)}p.position.y=Math.abs(Math.sin(t*3+i))*.018;u.arms.forEach((a,j)=>a.rotation.x=Math.sin(t*2+i+j)*.07)});renderer.render(scene,camera)}animate();update();toast('Welcome! Tap the blue espresso machine to serve your first customer.');
</script></body></html>
